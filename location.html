<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nearby NGOs & Help Centres</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .container {
            padding: 25px;
        }

        h1 {
            color: #333;
        }

        .description {
            color: #555;
            line-height: 1.6;
        }

        #findBtn {
            padding: 13px 22px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        #findBtn:hover {
            background: #1976d2;
        }

        #result {
            margin: 15px 0;
            font-weight: bold;
        }


        /* =========================
           PERMISSION POPUP
        ========================= */

        #permissionPopup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .permission-box {
            width: 350px;
            max-width: 90%;
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
        }

        .allow-btn,
        .cancel-btn {
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .allow-btn {
            background: #28a745;
        }

        .cancel-btn {
            background: #777;
            margin-left: 8px;
        }


        /* =========================
           MAP
        ========================= */

        #map {
            display: none;
            width: 100%;
            height: 600px;
        }


        /* =========================
           USER MARKER
        ========================= */

        .user-marker {
            width: 22px;
            height: 22px;
            background: #1976d2;
            border: 4px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }


        /* =========================
           HELP MARKER
        ========================= */

        .help-marker {
            width: 36px;
            height: 36px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            background: #e53935;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .help-marker::after {
            content: "❤️";
            position: absolute;
            transform: rotate(45deg);
            top: 7px;
            left: 7px;
            font-size: 18px;
        }


        /* =========================
           POPUP
        ========================= */

        .help-popup {
            min-width: 260px;
            max-width: 330px;
            font-size: 14px;
        }

        .help-popup h3 {
            color: #d32f2f;
            margin-top: 0;
        }

        .help-popup p {
            margin: 8px 0;
            line-height: 1.45;
        }

        .help-popup a {
            color: #1976d2;
            text-decoration: none;
        }

        .category {
            display: inline-block;
            background: #eeeeee;
            padding: 5px 9px;
            border-radius: 5px;
            margin-bottom: 8px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🤝 Find NGOs & Help Centres</h1>

    <p class="description">
        Find NGOs, orphanages, children's homes,
        old-age homes, shelters, charities and
        other help centres in your current city.
    </p>

    <button
        id="findBtn"
        onclick="showPermissionPopup()">

        📍 Find NGOs Near Me

    </button>

    <div id="result"></div>

</div>


<!-- =========================
     PERMISSION POPUP
========================= -->

<div id="permissionPopup">

    <div class="permission-box">

        <h2>📍 Location Permission</h2>

        <p>
            We need your location to find NGOs
            and help centres in your city.
        </p>

        <button
            class="allow-btn"
            onclick="getLocation()">

            Allow Location

        </button>

        <button
            class="cancel-btn"
            onclick="closePopup()">

            Cancel

        </button>

    </div>

</div>


<!-- MAP -->

<div id="map"></div>


<!-- Leaflet JS -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

let map = null;
let userMarker = null;
let helpMarkers = [];


// ==========================================
// SHOW PERMISSION POPUP
// ==========================================

function showPermissionPopup() {

    document.getElementById(
        "permissionPopup"
    ).style.display = "flex";

}


// ==========================================
// CLOSE POPUP
// ==========================================

function closePopup() {

    document.getElementById(
        "permissionPopup"
    ).style.display = "none";

}


// ==========================================
// GET USER LOCATION
// ==========================================

function getLocation() {

    closePopup();

    if (!navigator.geolocation) {

        document.getElementById("result").innerHTML =
            "❌ Geolocation is not supported.";

        return;
    }


    document.getElementById("result").innerHTML =
        "📍 Getting your current location...";


    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            // Show map immediately

            document.getElementById(
                "map"
            ).style.display = "block";


            // Create map

            if (!map) {

                map = L.map("map").setView(
                    [latitude, longitude],
                    13
                );


                L.tileLayer(
                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    {
                        attribution:
                        "&copy; OpenStreetMap contributors"
                    }
                ).addTo(map);

            }
            else {

                map.setView(
                    [latitude, longitude],
                    13
                );

            }


            setTimeout(function() {

                map.invalidateSize();

            }, 300);


            // ==================================
            // USER MARKER
            // ==================================

            if (userMarker) {

                userMarker.remove();

            }


            const userIcon =
                L.divIcon({

                    className: "",

                    html:
                    '<div class="user-marker"></div>',

                    iconSize: [30,30],

                    iconAnchor: [15,15]

                });


            userMarker =
                L.marker(

                    [latitude, longitude],

                    {
                        icon: userIcon
                    }

                ).addTo(map);


            userMarker.bindPopup(
                "<b>📍 You are here</b>"
            );


            // ==================================
            // DETECT CURRENT CITY
            // ==================================

            await detectCity(
                latitude,
                longitude
            );

        },


        function(error) {

            if (error.code === 1) {

                document.getElementById(
                    "result"
                ).innerHTML =
                    "❌ Location permission denied.";

            }
            else {

                document.getElementById(
                    "result"
                ).innerHTML =
                    "❌ Unable to get your location.";

            }

        },


        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}


// ==========================================
// DETECT CITY AUTOMATICALLY
// ==========================================

async function detectCity(
    latitude,
    longitude
) {

    document.getElementById(
        "result"
    ).innerHTML =
        "🔎 Detecting your city...";


    try {

        const response =
            await fetch(

                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`

            );


        const data =
            await response.json();


        const address =
            data.address || {};


        /*
         * IMPORTANT:
         *
         * The city is obtained from
         * the user's GPS coordinates.
         *
         * Nothing is hard-coded.
         */

        const city =

            address.city ||

            address.town ||

            address.municipality ||

            address.city_district ||

            address.county ||

            address.village;


        if (!city) {

            document.getElementById(
                "result"
            ).innerHTML =
                "❌ Could not determine your city.";

            return;

        }


        document.getElementById(
            "result"
        ).innerHTML =

            `📍 Your location: ${escapeHTML(city)}<br>
             🔎 Finding help centres in ${escapeHTML(city)}...`;


        // Search THIS CITY

        await findCityHelpCentres(
            latitude,
            longitude,
            city
        );

    }


    catch(error) {

        console.error(error);

        document.getElementById(
            "result"
        ).innerHTML =
            "❌ Could not detect your city.";

    }

}


// ==========================================
// FIND HELP CENTRES IN DETECTED CITY
// ==========================================

async function findCityHelpCentres(
    latitude,
    longitude,
    city
) {

    try {

        /*
         * First get the actual boundary
         * of the detected city.
         */

        const boundaryResponse =
            await fetch(

                `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}&polygon_geojson=1&addressdetails=1&limit=5`

            );


        const boundaryData =
            await boundaryResponse.json();


        let south;
        let north;
        let west;
        let east;


        /*
         * Find the result that is an
         * administrative boundary.
         */

        let cityBoundary = null;


        for (
            const result of boundaryData
        ) {

            if (
                result.boundingbox
            ) {

                cityBoundary =
                    result;

                break;

            }

        }


        if (cityBoundary) {

            const box =
                cityBoundary.boundingbox;


            south =
                Number(box[0]);

            north =
                Number(box[1]);

            west =
                Number(box[2]);

            east =
                Number(box[3]);

        }


        /*
         * Fallback if boundary cannot
         * be found.
         */

        if (
            south === undefined
        ) {

            const size = 0.20;


            south =
                latitude - size;

            north =
                latitude + size;

            west =
                longitude - size;

            east =
                longitude + size;

        }


        document.getElementById(
            "result"
        ).innerHTML =

            `🔎 Searching NGOs & help centres throughout ${escapeHTML(city)}...`;


        // ======================================
        // OVERPASS QUERY
        // ======================================

        const query = `

            [out:json][timeout:90];

            (

                /* NGOs */

                nwr["office"="ngo"]
                (${south},${west},${north},${east});

                nwr["amenity"="ngo"]
                (${south},${west},${north},${east});


                /* ORPHANAGES */

                nwr["amenity"="orphanage"]
                (${south},${west},${north},${east});

                nwr["social_facility"="orphanage"]
                (${south},${west},${north},${east});

                nwr["social_facility"="child"]
                (${south},${west},${north},${east});

                nwr["social_facility"="children"]
                (${south},${west},${north},${east});


                /* OLD AGE HOMES */

                nwr["social_facility"="senior_citizens"]
                (${south},${west},${north},${east});

                nwr["social_facility"="group_home"]
                (${south},${west},${north},${east});

                nwr["amenity"="nursing_home"]
                (${south},${west},${north},${east});


                /* SHELTERS */

                nwr["amenity"="shelter"]
                (${south},${west},${north},${east});

                nwr["social_facility"="shelter"]
                (${south},${west},${north},${east});

                nwr["social_facility"="homeless_shelter"]
                (${south},${west},${north},${east});


                /* WOMEN'S HELP */

                nwr["social_facility"="women_shelter"]
                (${south},${west},${north},${east});


                /* DISABILITY SUPPORT */

                nwr["social_facility"="disability"]
                (${south},${west},${north},${east});


                /* FOOD SUPPORT */

                nwr["amenity"="food_bank"]
                (${south},${west},${north},${east});


                /* CHARITIES */

                nwr["charity"]
                (${south},${west},${north},${east});

                nwr["nonprofit"]
                (${south},${west},${north},${east});


                /* COMMUNITY HELP */

                nwr["amenity"="community_centre"]
                (${south},${west},${north},${east});


                /* ASSOCIATIONS */

                nwr["office"="association"]
                (${south},${west},${north},${east});

            );

            out center tags;

        `;


        // ======================================
        // OVERPASS SERVERS
        // ======================================

        const servers = [

            "https://overpass-api.de/api/interpreter",

            "https://overpass.kumi.systems/api/interpreter",

            "https://overpass.private.coffee/api/interpreter"

        ];


        let data = null;


        // ======================================
        // TRY SERVERS
        // ======================================

        for (
            const server of servers
        ) {

            try {

                const response =
                    await fetch(

                        server,

                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                "application/x-www-form-urlencoded"
                            },

                            body:
                            "data=" +
                            encodeURIComponent(query)
                        }

                    );


                if (response.ok) {

                    const text =
                        await response.text();


                    if (text.trim()) {

                        data =
                            JSON.parse(text);

                        break;

                    }

                }

            }

            catch(error) {

                console.log(
                    "Trying another server..."
                );

            }

        }


        if (!data) {

            document.getElementById(
                "result"
            ).innerHTML =

                `❌ Could not load help centres in ${escapeHTML(city)}.`;

            return;

        }


        // ======================================
        // REMOVE OLD MARKERS
        // ======================================

        helpMarkers.forEach(
            marker => marker.remove()
        );


        helpMarkers = [];


        const uniquePlaces =
            new Set();


        let count = 0;


        // ======================================
        // ADD HELP CENTRE MARKERS
        // ======================================

        for (
            const place of data.elements
        ) {

            let lat;
            let lon;


            if (
                place.lat !== undefined &&
                place.lon !== undefined
            ) {

                lat =
                    place.lat;

                lon =
                    place.lon;

            }
            else if (
                place.center
            ) {

                lat =
                    place.center.lat;

                lon =
                    place.center.lon;

            }


            if (
                lat === undefined ||
                lon === undefined
            ) {

                continue;

            }


            const tags =
                place.tags || {};


            const name =

                tags.name ||

                tags["name:en"] ||

                tags["name:mr"] ||

                "Help Centre";


            const category =
                getCategory(tags);


            /*
             * Prevent duplicate markers.
             */

            const uniqueKey =
                name.toLowerCase() +
                "_" +
                lat.toFixed(5) +
                "_" +
                lon.toFixed(5);


            if (
                uniquePlaces.has(uniqueKey)
            ) {

                continue;

            }


            uniquePlaces.add(
                uniqueKey
            );


            // PHONE

            const phone =

                tags.phone ||

                tags["contact:phone"] ||

                tags["contact:mobile"] ||

                tags.mobile ||

                "Not available";


            // EMAIL

            const email =

                tags.email ||

                tags["contact:email"] ||

                "Not available";


            // WEBSITE

            let website =

                tags.website ||

                tags["contact:website"] ||

                "";


            // ADDRESS

            let addressParts = [

                tags["addr:housenumber"],
                tags["addr:street"],
                tags["addr:road"],
                tags["addr:suburb"],
                tags["addr:neighbourhood"],
                tags["addr:locality"],
                tags["addr:district"],
                tags["addr:city"],
                tags["addr:postcode"]

            ].filter(Boolean);


            let address =

                addressParts.length

                ? addressParts.join(", ")

                : "Finding address...";


            // OPENING HOURS

            const hours =

                tags.opening_hours ||

                "Not available";


            // ==================================
            // ICON
            // ==================================

            const helpIcon =
                L.divIcon({

                    className: "",

                    html:
                    '<div class="help-marker"></div>',

                    iconSize: [36,36],

                    iconAnchor: [18,36],

                    popupAnchor: [0,-36]

                });


            // ==================================
            // MARKER
            // ==================================

            const marker =
                L.marker(

                    [lat,lon],

                    {
                        icon: helpIcon
                    }

                ).addTo(map);


            // ==================================
            // PHONE HTML
            // ==================================

            let phoneHTML =
                "Not available";


            if (
                phone !== "Not available"
            ) {

                phoneHTML = `

                    <a
                        href="tel:${escapeHTML(phone)}">

                        ${escapeHTML(phone)}

                    </a>

                `;

            }


            // ==================================
            // WEBSITE
            // ==================================

            let websiteHTML = "";


            if (website) {

                if (
                    !website.startsWith("http://") &&
                    !website.startsWith("https://")
                ) {

                    website =
                        "https://" + website;

                }


                websiteHTML = `

                    <p>

                        🌐 <b>Website:</b><br>

                        <a
                            href="${escapeHTML(website)}"
                            target="_blank"
                            rel="noopener">

                            Visit Website

                        </a>

                    </p>

                `;

            }


            // ==================================
            // POPUP
            // ==================================

            marker.bindPopup(

                createPopup(

                    name,
                    category,
                    address,
                    phoneHTML,
                    email,
                    hours,
                    websiteHTML

                )

            );


            // ==================================
            // GET ADDRESS IF MISSING
            // ==================================

            if (
                addressParts.length === 0
            ) {

                getAddress(
                    lat,
                    lon
                ).then(
                    function(realAddress) {

                        marker.setPopupContent(

                            createPopup(

                                name,
                                category,
                                realAddress,
                                phoneHTML,
                                email,
                                hours,
                                websiteHTML

                            )

                        );

                    }
                );

            }


            helpMarkers.push(
                marker
            );


            count++;

        }


        // ======================================
        // RESULT
        // ======================================

        document.getElementById(
            "result"
        ).innerHTML =

            `📍 ${count} NGOs & Help Centres found in ${escapeHTML(city)}`;


        // ======================================
        // FIT MAP TO MARKERS
        // ======================================

        if (
            helpMarkers.length > 0
        ) {

            const group =
                L.featureGroup(
                    helpMarkers
                );


            map.fitBounds(
                group.getBounds().pad(0.15)
            );

        }

    }


    catch(error) {

        console.error(error);

        document.getElementById(
            "result"
        ).innerHTML =
            "❌ Error while finding help centres.";

    }

}


// ==========================================
// REVERSE ADDRESS
// ==========================================

async function getAddress(
    latitude,
    longitude
) {

    try {

        const response =
            await fetch(

                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`

            );


        const data =
            await response.json();


        const a =
            data.address || {};


        const parts = [

            a.house_number,
            a.road,
            a.neighbourhood,
            a.suburb,
            a.locality,
            a.city_district,
            a.town,
            a.city,
            a.state,
            a.postcode

        ].filter(Boolean);


        if (
            parts.length
        ) {

            return parts.join(", ");

        }


        return (
            data.display_name ||
            "Address not available"
        );

    }

    catch(error) {

        return "Address not available";

    }

}


// ==========================================
// POPUP
// ==========================================

function createPopup(

    name,
    category,
    address,
    phone,
    email,
    hours,
    website

) {

    return `

        <div class="help-popup">

            <h3>

                ${getEmoji(category)}

                ${escapeHTML(name)}

            </h3>


            <div class="category">

                ${escapeHTML(category)}

            </div>


            <p>

                📍 <b>Address:</b><br>

                ${escapeHTML(address)}

            </p>


            <p>

                📞 <b>Phone:</b><br>

                ${phone}

            </p>


            <p>

                ✉️ <b>Email:</b><br>

                ${escapeHTML(email)}

            </p>


            <p>

                🕐 <b>Opening Hours:</b><br>

                ${escapeHTML(hours)}

            </p>


            ${website}

        </div>

    `;

}


// ==========================================
// CATEGORY
// ==========================================

function getCategory(tags) {

    if (
        tags.office === "ngo" ||
        tags.amenity === "ngo"
    ) {

        return "NGO";

    }


    if (
        tags.amenity === "orphanage" ||
        tags.social_facility === "orphanage" ||
        tags.social_facility === "child" ||
        tags.social_facility === "children"
    ) {

        return "Children's Home / Orphanage";

    }


    if (
        tags.social_facility === "senior_citizens" ||
        tags.social_facility === "group_home" ||
        tags.amenity === "nursing_home"
    ) {

        return "Old Age Home";

    }


    if (
        tags.amenity === "shelter" ||
        tags.social_facility === "shelter" ||
        tags.social_facility === "homeless_shelter"
    ) {

        return "Shelter / Emergency Help";

    }


    if (
        tags.social_facility === "women_shelter"
    ) {

        return "Women's Shelter";

    }


    if (
        tags.social_facility === "disability"
    ) {

        return "Disability Support";

    }


    if (
        tags.amenity === "food_bank"
    ) {

        return "Food Support";

    }


    if (
        tags.charity ||
        tags.nonprofit
    ) {

        return "Charity / Non-Profit";

    }


    if (
        tags.amenity === "community_centre"
    ) {

        return "Community Help Centre";

    }


    if (
        tags.office === "association"
    ) {

        return "Social Association";

    }


    return "Help Centre";

}


// ==========================================
// EMOJI
// ==========================================

function getEmoji(category) {

    if (
        category.includes("Children")
    ) {
        return "👶";
    }

    if (
        category.includes("Old Age")
    ) {
        return "👴";
    }

    if (
        category.includes("Shelter")
    ) {
        return "🏠";
    }

    if (
        category.includes("Women")
    ) {
        return "👩";
    }

    if (
        category.includes("Disability")
    ) {
        return "🧑‍🦽";
    }

    if (
        category.includes("Food")
    ) {
        return "🍲";
    }

    if (
        category.includes("NGO")
    ) {
        return "🤝";
    }

    if (
        category.includes("Charity")
    ) {
        return "❤️";
    }

    return "🆘";

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>

</html>

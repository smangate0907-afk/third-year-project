<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nearby NGOs & Help Centres</title>


    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {

            font-family: Arial, sans-serif;

            background: #e6f7fb;

            overflow-x: hidden;
        }


        /* =========================================
           UPPER SECTION
        ========================================= */

        .container {

            width: 100%;

            padding: 30px 5%;

            background: #e6f7fb;

            text-align: left;
        }


        h1 {

            margin: 0 0 15px 0;

            color: #333;

            font-size: clamp(26px, 4vw, 42px);

            line-height: 1.2;
        }


        .description {

            margin: 0 0 22px 0;

            color: #555;

            font-size: clamp(15px, 1.5vw, 19px);

            line-height: 1.6;

            max-width: 900px;
        }


        /* =========================================
           FIND BUTTON
        ========================================= */

        #findBtn {

            padding: 13px 22px;

            background: #2196f3;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: clamp(14px, 1.5vw, 17px);

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        #findBtn:hover {

            background: #1976d2;

            transform: translateY(-1px);
        }


        #findBtn:active {

            transform: translateY(0);
        }


        /* =========================================
           RESULT
        ========================================= */

        #result {

            margin: 15px 0 0 0;

            font-weight: bold;

            color: #333;

            font-size: clamp(13px, 1.4vw, 17px);

            line-height: 1.5;
        }


        /* =========================================
           PERMISSION POPUP
        ========================================= */

        #permissionPopup {

            display: none;

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            padding: 20px;

            background: rgba(0, 0, 0, 0.55);

            justify-content: center;

            align-items: center;

            z-index: 9999;
        }


        .permission-box {

            width: min(420px, 100%);

            background: white;

            padding: clamp(22px, 5vw, 35px);

            border-radius: 16px;

            text-align: center;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.25);
        }


        .permission-box h2 {

            margin-top: 0;

            font-size: clamp(21px, 4vw, 28px);

            color: #333;
        }


        .permission-box p {

            font-size: clamp(14px, 2vw, 16px);

            line-height: 1.5;

            color: #555;

            margin-bottom: 22px;
        }


        /* =========================================
           POPUP BUTTONS
        ========================================= */

        .allow-btn,
        .cancel-btn {

            padding: 11px 20px;

            border: none;

            border-radius: 6px;

            color: white;

            cursor: pointer;

            font-size: 15px;

            transition: 0.2s ease;
        }


        .allow-btn {

            background: #28a745;
        }


        .allow-btn:hover {

            background: #218838;
        }


        .cancel-btn {

            background: #777;

            margin-left: 8px;
        }


        .cancel-btn:hover {

            background: #666;
        }


        /* =========================================
           MAP
        ========================================= */

        #map {

            display: none;

            width: 100%;

            height: clamp(450px, 65vh, 800px);

            min-height: 400px;
        }


        /* =========================================
           USER MARKER
        ========================================= */

        .user-marker {

            width: 22px;

            height: 22px;

            background: #1976d2;

            border: 4px solid white;

            border-radius: 50%;

            box-shadow:
                0 0 10px rgba(0, 0, 0, 0.5);
        }


        /* =========================================
           HELP MARKER
        ========================================= */

        .help-marker {

            width: 36px;

            height: 36px;

            border-radius:
                50% 50% 50% 0;

            transform: rotate(-45deg);

            background: #e53935;

            border: 3px solid white;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.4);
        }


        .help-marker::after {

            content: "❤️";

            position: absolute;

            transform: rotate(45deg);

            top: 7px;

            left: 7px;

            font-size: 18px;
        }


        /* =========================================
           POPUP
        ========================================= */

        .help-popup {

            min-width: 240px;

            max-width: min(330px, 80vw);

            font-size: 14px;

            word-wrap: break-word;
        }


        .help-popup h3 {

            color: #d32f2f;

            margin-top: 0;

            line-height: 1.3;
        }


        .help-popup p {

            margin: 8px 0;

            line-height: 1.45;
        }


        .help-popup a {

            color: #1976d2;

            text-decoration: none;

            word-break: break-word;
        }


        .help-popup a:hover {

            text-decoration: underline;
        }


        .category {

            display: inline-block;

            background: #eeeeee;

            padding: 5px 9px;

            border-radius: 5px;

            margin-bottom: 8px;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1024px) {

            .container {

                padding:
                    25px 4%;
            }


            #map {

                height: 60vh;

                min-height: 450px;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .container {

                padding:
                    20px 18px;
            }


            h1 {

                font-size: 27px;

                margin-bottom: 12px;
            }


            .description {

                font-size: 15px;

                line-height: 1.55;

                margin-bottom: 18px;
            }


            #findBtn {

                width: 100%;

                padding: 13px 15px;

                font-size: 15px;
            }


            #result {

                font-size: 14px;

                margin-top: 13px;
            }


            #map {

                height: 65vh;

                min-height: 430px;
            }


            .permission-box {

                padding: 25px 20px;
            }


            .allow-btn,
            .cancel-btn {

                width: 100%;

                margin: 5px 0;

                padding: 12px;
            }


            .help-popup {

                min-width: 0;

                width: 100%;

                max-width: 260px;
            }

        }


        /* =========================================
           VERY SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {

            .container {

                padding:
                    17px 14px;
            }


            h1 {

                font-size: 24px;
            }


            .description {

                font-size: 14px;
            }


            #map {

                height: 68vh;

                min-height: 400px;
            }

        }


        /* =========================================
           LARGE DESKTOP
        ========================================= */

        @media (min-width: 1400px) {

            .container {

                padding:

                    35px
                    max(5%, calc((100vw - 1400px) / 2));
            }


            #map {

                height: 70vh;

                min-height: 600px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         UPPER SECTION
    ========================================= -->

    <div class="container">


        <h1>
            🤝 Find NGOs & Help Centres
        </h1>


        <p class="description">

            Find NGOs, orphanages, children's homes,
            old-age homes, shelters, charities and
            other help centres in your current city.

        </p>


        <button
            id="findBtn"
            onclick="showPermissionPopup()">

            📍 Find NGOs Near Me

        </button>


        <div id="result"></div>


    </div>



    <!-- =========================================
         PERMISSION POPUP
    ========================================= -->

    <div id="permissionPopup">


        <div class="permission-box">


            <h2>
                📍 Location Permission
            </h2>


            <p>

                We need your location to find NGOs
                and help centres in your city.

            </p>


            <button
                class="allow-btn"
                onclick="getLocation()">

                Allow Location

            </button>


            <button
                class="cancel-btn"
                onclick="closePopup()">

                Cancel

            </button>


        </div>


    </div>



    <!-- =========================================
         MAP
    ========================================= -->

    <div id="map"></div>



    <!-- =========================================
         LEAFLET JS
    ========================================= -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>



    <script>


        let map = null;

        let userMarker = null;

        let helpMarkers = [];



        // ==========================================
        // SHOW PERMISSION POPUP
        // ==========================================

        function showPermissionPopup() {

            document.getElementById(
                "permissionPopup"
            ).style.display = "flex";

        }



        // ==========================================
        // CLOSE POPUP
        // ==========================================

        function closePopup() {

            document.getElementById(
                "permissionPopup"
            ).style.display = "none";

        }



        // ==========================================
        // GET USER LOCATION
        // ==========================================

        function getLocation() {

            closePopup();


            if (!navigator.geolocation) {

                document.getElementById(
                    "result"
                ).innerHTML =
                    "❌ Geolocation is not supported.";

                return;

            }


            document.getElementById(
                "result"
            ).innerHTML =
                "📍 Getting your current location...";


            navigator.geolocation.getCurrentPosition(

                async function(position) {


                    const latitude =
                        position.coords.latitude;


                    const longitude =
                        position.coords.longitude;



                    // Show map

                    document.getElementById(
                        "map"
                    ).style.display = "block";



                    // ==================================
                    // CREATE MAP
                    // ==================================

                    if (!map) {


                        map = L.map("map").setView(

                            [
                                latitude,
                                longitude
                            ],

                            13

                        );


                        L.tileLayer(

                            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

                            {

                                attribution:
                                    "&copy; OpenStreetMap contributors"

                            }

                        ).addTo(map);


                    }


                    else {

                        map.setView(

                            [
                                latitude,
                                longitude
                            ],

                            13

                        );

                    }



                    // Fix Leaflet size

                    setTimeout(function() {

                        map.invalidateSize();

                    }, 300);



                    // ==================================
                    // USER MARKER
                    // ==================================

                    if (userMarker) {

                        userMarker.remove();

                    }


                    const userIcon =

                        L.divIcon({

                            className: "",

                            html:
                                '<div class="user-marker"></div>',

                            iconSize:
                                [30, 30],

                            iconAnchor:
                                [15, 15]

                        });



                    userMarker =

                        L.marker(

                            [
                                latitude,
                                longitude
                            ],

                            {
                                icon:
                                    userIcon
                            }

                        ).addTo(map);



                    userMarker.bindPopup(
                        "<b>📍 You are here</b>"
                    );



                    // ==================================
                    // DETECT CITY
                    // ==================================

                    await detectCity(

                        latitude,
                        longitude

                    );


                },


                function(error) {


                    if (error.code === 1) {

                        document.getElementById(
                            "result"
                        ).innerHTML =
                            "❌ Location permission denied.";

                    }


                    else {

                        document.getElementById(
                            "result"
                        ).innerHTML =
                            "❌ Unable to get your location.";

                    }

                },


                {

                    enableHighAccuracy:
                        true,

                    timeout:
                        15000,

                    maximumAge:
                        0

                }

            );

        }



        // ==========================================
        // DETECT CITY
        // ==========================================

        async function detectCity(

            latitude,
            longitude

        ) {


            document.getElementById(
                "result"
            ).innerHTML =
                "🔎 Detecting your city...";


            try {


                const response =

                    await fetch(

                        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`

                    );


                const data =

                    await response.json();


                const address =

                    data.address || {};



                const city =

                    address.city ||

                    address.town ||

                    address.municipality ||

                    address.city_district ||

                    address.county ||

                    address.village;



                if (!city) {


                    document.getElementById(
                        "result"
                    ).innerHTML =
                        "❌ Could not determine your city.";

                    return;

                }



                document.getElementById(
                    "result"
                ).innerHTML =

                    `📍 Your location: ${escapeHTML(city)}<br>
                     🔎 Finding help centres in ${escapeHTML(city)}...`;



                await findCityHelpCentres(

                    latitude,
                    longitude,
                    city

                );


            }


            catch(error) {


                console.error(error);


                document.getElementById(
                    "result"
                ).innerHTML =
                    "❌ Could not detect your city.";

            }

        }



        // ==========================================
        // FIND HELP CENTRES
        // ==========================================

        async function findCityHelpCentres(

            latitude,
            longitude,
            city

        ) {


            try {


                const boundaryResponse =

                    await fetch(

                        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}&polygon_geojson=1&addressdetails=1&limit=5`

                    );


                const boundaryData =

                    await boundaryResponse.json();



                let south;

                let north;

                let west;

                let east;



                let cityBoundary = null;



                for (

                    const result of boundaryData

                ) {


                    if (result.boundingbox) {

                        cityBoundary =
                            result;

                        break;

                    }

                }



                if (cityBoundary) {


                    const box =
                        cityBoundary.boundingbox;


                    south =
                        Number(box[0]);


                    north =
                        Number(box[1]);


                    west =
                        Number(box[2]);


                    east =
                        Number(box[3]);

                }



                if (south === undefined) {


                    const size = 0.20;


                    south =
                        latitude - size;


                    north =
                        latitude + size;


                    west =
                        longitude - size;


                    east =
                        longitude + size;

                }



                document.getElementById(
                    "result"
                ).innerHTML =

                    `🔎 Searching NGOs & help centres throughout ${escapeHTML(city)}...`;



                // ======================================
                // OVERPASS QUERY
                // ======================================

                const query = `

                    [out:json][timeout:90];

                    (

                        nwr["office"="ngo"]
                        (${south},${west},${north},${east});

                        nwr["amenity"="ngo"]
                        (${south},${west},${north},${east});

                        nwr["amenity"="orphanage"]
                        (${south},${west},${north},${east});

                        nwr["social_facility"="orphanage"]
                        (${south},${west},${north},${east});

                        nwr["social_facility"="child"]
                        (${south},${west},${north},${east});

                        nwr["social_facility"="children"]
                        (${south},${west},${north},${east});

                        nwr["social_facility"="senior_citizens"]
                        (${south},${west},${north},${east});

                        nwr["social_facility"="group_home"]
                        (${south},${west},${north},${east});

                        nwr["amenity"="nursing_home"]
                        (${south},${west},${north},${east});

                        nwr["amenity"="shelter"]
                        (${south},${west},${north},${east});

                        nwr["social_facility"="shelter"]
                        (${south},${west},${north},${east});

                        nwr["social_facility"="homeless_shelter"]
                        (${south},${west},${north},${east});

                        nwr["social_facility"="women_shelter"]
                        (${south},${west},${north},${east});

                        nwr["social_facility"="disability"]
                        (${south},${west},${north},${east});

                        nwr["amenity"="food_bank"]
                        (${south},${west},${north},${east});

                        nwr["charity"]
                        (${south},${west},${north},${east});

                        nwr["nonprofit"]
                        (${south},${west},${north},${east});

                        nwr["amenity"="community_centre"]
                        (${south},${west},${north},${east});

                        nwr["office"="association"]
                        (${south},${west},${north},${east});

                    );

                    out center tags;

                `;



                // ======================================
                // OVERPASS SERVERS
                // ======================================

                const servers = [

                    "https://overpass-api.de/api/interpreter",

                    "https://overpass.kumi.systems/api/interpreter",

                    "https://overpass.private.coffee/api/interpreter"

                ];



                let data = null;



                // ======================================
                // TRY SERVERS
                // ======================================

                for (

                    const server of servers

                ) {


                    try {


                        const response =

                            await fetch(

                                server,

                                {

                                    method:
                                        "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/x-www-form-urlencoded"

                                    },

                                    body:
                                        "data=" +
                                        encodeURIComponent(query)

                                }

                            );



                        if (response.ok) {


                            const text =

                                await response.text();



                            if (text.trim()) {


                                data =
                                    JSON.parse(text);


                                break;

                            }

                        }


                    }


                    catch(error) {


                        console.log(
                            "Trying another server..."
                        );

                    }

                }



                if (!data) {


                    document.getElementById(
                        "result"
                    ).innerHTML =

                        `❌ Could not load help centres in ${escapeHTML(city)}.`;

                    return;

                }



                // ======================================
                // REMOVE OLD MARKERS
                // ======================================

                helpMarkers.forEach(

                    marker =>
                        marker.remove()

                );


                helpMarkers = [];



                const uniquePlaces =
                    new Set();


                let count = 0;



                // ======================================
                // ADD HELP CENTRE MARKERS
                // ======================================

                for (

                    const place of data.elements

                ) {


                    let lat;

                    let lon;



                    if (

                        place.lat !== undefined &&

                        place.lon !== undefined

                    ) {


                        lat =
                            place.lat;


                        lon =
                            place.lon;

                    }


                    else if (place.center) {


                        lat =
                            place.center.lat;


                        lon =
                            place.center.lon;

                    }



                    if (

                        lat === undefined ||

                        lon === undefined

                    ) {

                        continue;

                    }



                    const tags =
                        place.tags || {};



                    const name =

                        tags.name ||

                        tags["name:en"] ||

                        tags["name:mr"] ||

                        "Help Centre";



                    const category =
                        getCategory(tags);



                    const uniqueKey =

                        name.toLowerCase() +
                        "_" +
                        lat.toFixed(5) +
                        "_" +
                        lon.toFixed(5);



                    if (
                        uniquePlaces.has(uniqueKey)
                    ) {

                        continue;

                    }



                    uniquePlaces.add(
                        uniqueKey
                    );



                    // PHONE

                    const phone =

                        tags.phone ||

                        tags["contact:phone"] ||

                        tags["contact:mobile"] ||

                        tags.mobile ||

                        "Not available";



                    // EMAIL

                    const email =

                        tags.email ||

                        tags["contact:email"] ||

                        "Not available";



                    // WEBSITE

                    let website =

                        tags.website ||

                        tags["contact:website"] ||

                        "";



                    // ADDRESS

                    let addressParts = [

                        tags["addr:housenumber"],

                        tags["addr:street"],

                        tags["addr:road"],

                        tags["addr:suburb"],

                        tags["addr:neighbourhood"],

                        tags["addr:locality"],

                        tags["addr:district"],

                        tags["addr:city"],

                        tags["addr:postcode"]

                    ].filter(Boolean);



                    let address =

                        addressParts.length

                        ? addressParts.join(", ")

                        : "Finding address...";



                    // OPENING HOURS

                    const hours =

                        tags.opening_hours ||

                        "Not available";



                    // ==================================
                    // ICON
                    // ==================================

                    const helpIcon =

                        L.divIcon({

                            className: "",

                            html:
                                '<div class="help-marker"></div>',

                            iconSize:
                                [36, 36],

                            iconAnchor:
                                [18, 36],

                            popupAnchor:
                                [0, -36]

                        });



                    // ==================================
                    // MARKER
                    // ==================================

                    const marker =

                        L.marker(

                            [lat, lon],

                            {
                                icon:
                                    helpIcon
                            }

                        ).addTo(map);



                    // ==================================
                    // PHONE HTML
                    // ==================================

                    let phoneHTML =
                        "Not available";



                    if (

                        phone !==
                        "Not available"

                    ) {


                        phoneHTML = `

                            <a
                                href="tel:${escapeHTML(phone)}">

                                ${escapeHTML(phone)}

                            </a>

                        `;

                    }



                    // ==================================
                    // WEBSITE
                    // ==================================

                    let websiteHTML = "";



                    if (website) {


                        if (

                            !website.startsWith(
                                "http://"
                            ) &&

                            !website.startsWith(
                                "https://"
                            )

                        ) {

                            website =
                                "https://" + website;

                        }



                        websiteHTML = `

                            <p>

                                🌐 <b>Website:</b><br>

                                <a
                                    href="${escapeHTML(website)}"
                                    target="_blank"
                                    rel="noopener">

                                    Visit Website

                                </a>

                            </p>

                        `;

                    }



                    // ==================================
                    // POPUP
                    // ==================================

                    marker.bindPopup(

                        createPopup(

                            name,

                            category,

                            address,

                            phoneHTML,

                            email,

                            hours,

                            websiteHTML

                        )

                    );



                    // ==================================
                    // GET ADDRESS IF MISSING
                    // ==================================

                    if (

                        addressParts.length === 0

                    ) {


                        getAddress(

                            lat,
                            lon

                        ).then(

                            function(realAddress) {


                                marker.setPopupContent(

                                    createPopup(

                                        name,

                                        category,

                                        realAddress,

                                        phoneHTML,

                                        email,

                                        hours,

                                        websiteHTML

                                    )

                                );

                            }

                        );

                    }



                    helpMarkers.push(
                        marker
                    );


                    count++;

                }



                // ======================================
                // RESULT
                // ======================================

                document.getElementById(
                    "result"
                ).innerHTML =

                    `📍 ${count} NGOs & Help Centres found in ${escapeHTML(city)}`;



                // ======================================
                // FIT MAP
                // ======================================

                if (

                    helpMarkers.length > 0

                ) {


                    const group =

                        L.featureGroup(
                            helpMarkers
                        );


                    map.fitBounds(

                        group
                            .getBounds()
                            .pad(0.15)

                    );

                }


            }


            catch(error) {


                console.error(error);


                document.getElementById(
                    "result"
                ).innerHTML =
                    "❌ Error while finding help centres.";

            }

        }



        // ==========================================
        // REVERSE ADDRESS
        // ==========================================

        async function getAddress(

            latitude,
            longitude

        ) {


            try {


                const response =

                    await fetch(

                        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`

                    );


                const data =

                    await response.json();


                const a =

                    data.address || {};



                const parts = [

                    a.house_number,

                    a.road,

                    a.neighbourhood,

                    a.suburb,

                    a.locality,

                    a.city_district,

                    a.town,

                    a.city,

                    a.state,

                    a.postcode

                ].filter(Boolean);



                if (parts.length) {

                    return parts.join(", ");

                }



                return (

                    data.display_name ||

                    "Address not available"

                );


            }


            catch(error) {


                return "Address not available";

            }

        }



        // ==========================================
        // POPUP
        // ==========================================

        function createPopup(

            name,

            category,

            address,

            phone,

            email,

            hours,

            website

        ) {


            return `

                <div class="help-popup">

                    <h3>

                        ${getEmoji(category)}

                        ${escapeHTML(name)}

                    </h3>


                    <div class="category">

                        ${escapeHTML(category)}

                    </div>


                    <p>

                        📍 <b>Address:</b><br>

                        ${escapeHTML(address)}

                    </p>


                    <p>

                        📞 <b>Phone:</b><br>

                        ${phone}

                    </p>


                    <p>

                        ✉️ <b>Email:</b><br>

                        ${escapeHTML(email)}

                    </p>


                    <p>

                        🕐 <b>Opening Hours:</b><br>

                        ${escapeHTML(hours)}

                    </p>


                    ${website}

                </div>

            `;

        }



        // ==========================================
        // CATEGORY
        // ==========================================

        function getCategory(tags) {


            if (

                tags.office === "ngo" ||

                tags.amenity === "ngo"

            ) {

                return "NGO";

            }



            if (

                tags.amenity === "orphanage" ||

                tags.social_facility ===
                    "orphanage" ||

                tags.social_facility ===
                    "child" ||

                tags.social_facility ===
                    "children"

            ) {

                return "Children's Home / Orphanage";

            }



            if (

                tags.social_facility ===
                    "senior_citizens" ||

                tags.social_facility ===
                    "group_home" ||

                tags.amenity ===
                    "nursing_home"

            ) {

                return "Old Age Home";

            }



            if (

                tags.amenity ===
                    "shelter" ||

                tags.social_facility ===
                    "shelter" ||

                tags.social_facility ===
                    "homeless_shelter"

            ) {

                return "Shelter / Emergency Help";

            }



            if (

                tags.social_facility ===
                    "women_shelter"

            ) {

                return "Women's Shelter";

            }



            if (

                tags.social_facility ===
                    "disability"

            ) {

                return "Disability Support";

            }



            if (

                tags.amenity ===
                    "food_bank"

            ) {

                return "Food Support";

            }



            if (

                tags.charity ||

                tags.nonprofit

            ) {

                return "Charity / Non-Profit";

            }



            if (

                tags.amenity ===
                    "community_centre"

            ) {

                return "Community Help Centre";

            }



            if (

                tags.office ===
                    "association"

            ) {

                return "Social Association";

            }



            return "Help Centre";

        }



        // ==========================================
        // EMOJI
        // ==========================================

        function getEmoji(category) {


            if (
                category.includes("Children")
            ) {

                return "👶";

            }



            if (
                category.includes("Old Age")
            ) {

                return "👴";

            }



            if (
                category.includes("Shelter")
            ) {

                return "🏠";

            }



            if (
                category.includes("Women")
            ) {

                return "👩";

            }



            if (
                category.includes("Disability")
            ) {

                return "🧑‍🦽";

            }



            if (
                category.includes("Food")
            ) {

                return "🍲";

            }



            if (
                category.includes("NGO")
            ) {

                return "🤝";

            }



            if (
                category.includes("Charity")
            ) {

                return "❤️";

            }



            return "🆘";

        }



        // ==========================================
        // ESCAPE HTML
        // ==========================================

        function escapeHTML(text) {


            return String(text)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }

    </script>
